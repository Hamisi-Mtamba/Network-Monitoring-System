@if (service.request(); as request) {
  <div class="confirm-backdrop" (click)="backdrop()">
    <div
      #dialog
      class="confirm-dialog"
      [class]="'confirm-dialog confirm-dialog--' + request.tone"
      role="dialog"
      aria-modal="true"
      [attr.aria-labelledby]="titleId"
      [attr.aria-describedby]="request.message ? descriptionId : null"
      (click)="$event.stopPropagation()"
      (keydown)="onKeydown($event)"
    >
      <header class="confirm-dialog__header">
        <span class="confirm-dialog__icon" aria-hidden="true">
          <ion-icon [name]="icon(request.tone)"></ion-icon>
        </span>
        <h2 [id]="titleId">{{ request.title }}</h2>
      </header>

      @if (request.message) {
        <p class="confirm-dialog__message" [id]="descriptionId">{{ request.message }}</p>
      }

      @if (request.details.length) {
        <dl class="confirm-dialog__details">
          @for (row of request.details; track row.label) {
            <div>
              <dt>{{ row.label }}</dt>
              <dd>{{ row.value }}</dd>
            </div>
          }
        </dl>
      }

      <footer class="confirm-dialog__actions">
        <button #cancelButton type="button" class="btn btn--ghost" (click)="answer(false)">
          {{ request.cancelLabel }}
        </button>
        <button
          #confirmButton
          type="button"
          class="btn"
          [class.btn--danger]="request.tone === 'danger'"
          [class.btn--primary]="request.tone !== 'danger'"
          (click)="answer(true)"
        >
          {{ request.confirmLabel }}
        </button>
      </footer>
    </div>
  </div>
}
