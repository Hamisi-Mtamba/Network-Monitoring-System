<main class="page-shell expired-page">

    <section class="expired-card">

        <!-- Expired session icon -->
        <div
            class="expired-icon"
            aria-hidden="true"
        >
            ⌛
        </div>


        <!-- Page status -->
        <span class="expired-kicker">
            Session ended
        </span>


        <!-- Main message -->
        <h1>
            Your internet package has expired
        </h1>


        <p>
            Choose another package to reconnect and continue browsing.
        </p>


        <!-- Return to this company's packages -->
        @if (tenantService.companySlug()) {

            <a
                class="button button--primary button--full"
                [routerLink]="[
                    '/',
                    tenantService.companySlug(),
                    'packages'
                ]"
            >
                Buy another package
            </a>

        }


        <!-- Support note -->
        <p class="support-copy">
            Need help? Contact your Wi-Fi provider for assistance.
        </p>

    </section>

</main>
