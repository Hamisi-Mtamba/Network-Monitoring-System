<button
    type="button"
    class="method-card"
    [class.method-card--selected]="selected()"
    [disabled]="disabled()"
    [attr.aria-pressed]="selected()"
    (click)="methodSelected.emit(method())"
>

    <!-- Mobile-money provider logo -->
    <span
        class="method-card__logo"
        [style.--method-color]="method().color"
    >

        <img
            [src]="method().image"
            alt=""
            aria-hidden="true"
            class="method-card__logo-image"
        />

    </span>


    <!-- Payment provider name -->
    <span class="method-card__name">
        {{ method().name }}
    </span>


    <!-- Selected indicator -->
    <span
        class="method-card__check"
        aria-hidden="true"
    >
        ✓
    </span>

</button>
